[package]
name = "sn-client"
description = "Desktop client: renders the Subnautica world from the player's own install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Shared server save I/O and platform save-directory policy (M9f).
sn-server = { path = "../sn-server" }
sn-unity.workspace = true
sn-anim.workspace = true
# Engine: windowing, input, ECS, PBR rendering (see docs/DESIGN.md §3.3);
# free_camera: built-in fly camera controller.
bevy = { version = "0.19.1", features = ["free_camera"] }
sn-assets.workspace = true
sn-install.workspace = true
sn-mesh.workspace = true
# UDP for --host and --join (M10h).
sn-net.workspace = true
sn-octree.workspace = true
# The world's messages and settings (M10g).
sn-protocol.workspace = true
# The in-process server and the client's session logic (M10g).
sn-session.workspace = true
# The player's rules and collision (M9b).
sn-sim.workspace = true
# The game's UI, headless: canvas placement and draw lists (M9u5c).
sn-ui.workspace = true
sn-terrain.workspace = true
sn-world.workspace = true

[lints]
workspace = true

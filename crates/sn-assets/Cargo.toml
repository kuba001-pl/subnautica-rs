[package]
name = "sn-assets"
description = "Finds and loads Unity objects across the game's bundles (read-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# M7f4: the animation runtime (pure), for animators' default poses.
sn-anim.workspace = true
sn-dotnet.workspace = true
sn-install.workspace = true
# M10e: the rules fingerprint uses the protocol's hash.
sn-protocol.workspace = true
sn-sim.workspace = true
sn-terrain.workspace = true
# M9u3: font assets typed as the UI crate's font types.
sn-ui.workspace = true
sn-unity.workspace = true
sn-world.workspace = true

[dev-dependencies]
# M9u1: the test assembly writer, for the layout builder's synthetic tests.
sn-dotnet = { workspace = true, features = ["encode"] }

[lints]
workspace = true
